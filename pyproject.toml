[project]
name = "gpt2-from-scratch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "einops>=0.8.2",
    "jaxtyping>=0.3.11",
    "numpy>=2.4.6",
    "torch>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"